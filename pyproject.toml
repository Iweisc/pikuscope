[project]
name = "pikuscope"
version = "0.1.0"
description = "AI code review bot with CodeRabbit/Greptile feature parity"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
pikuscope = "pikuscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pikuscope*"]
